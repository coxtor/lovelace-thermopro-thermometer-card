<!doctype html><html lang="en"><meta charset="utf-8"><title>ThermoPro state review</title>
<thermopro-thermometer-card id="card"></thermopro-thermometer-card><pre id="result">RUNNING</pre>
<script src="../thermopro-thermometer-card.js"></script><script>
(async()=>{const checks=[],check=(v,m)=>{if(!v)throw Error(m);checks.push(m)},wait=()=>new Promise(r=>setTimeout(r,30));try{
const rows=[],states={},calls=[];for(const device of ['first','second'])for(const [domain,role,state,attributes] of [
 ['sensor','probe_1_temperature','25',{device_class:'temperature',unit_of_measurement:'°C'}],
 ['sensor','probe_1_alarm_profile','target',{high_celsius:device==='first'?60:80,low_celsius:0}],
 ['switch','device_alarm','on',{}]]){
 const entity_id=`${domain}.${device}_${role}`;rows.push({entity_id,unique_id:device+'_'+role,original_name:role.replaceAll('_',' '),platform:'thermopro',device_id:device});states[entity_id]={state,attributes};
}
const hass={language:'en',states,services:{thermopro:{set_alarm_profile:{}}},callWS:async m=>m.type==='config/entity_registry/list'?rows:m.type==='config/device_registry/list'?['first','second'].map(id=>({id,name:id,model:'TP25'})):{},callService:async(d,s,data)=>{calls.push(data);states[`sensor.${data.device_id}_probe_1_alarm_profile`].attributes.high_celsius=data.high;}};
const card=document.querySelector('#card');card.setConfig({device_id:'first'});card.hass=hass;await wait();const root=card.shadowRoot;root.querySelector('[data-section=alarms]').open=true;
check(root.querySelector('[data-high="1"]').value==='60','Initial confirmed threshold renders');
states['sensor.first_probe_1_alarm_profile'].attributes.high_celsius=70;card.hass={...hass};check(root.querySelector('[data-high="1"]').value==='70','Untouched inputs follow external profile changes');
let input=root.querySelector('[data-high="1"]');input.value='75';input.dispatchEvent(new Event('input',{bubbles:true}));card.hass={...hass};check(root.querySelector('[data-high="1"]').value==='75','User draft survives unrelated HA update');
root.querySelector('[data-save-profile="1"]').click();await wait();check(calls[0].high===75,'Applying user draft sends entered value');
states['sensor.first_probe_1_alarm_profile'].attributes.high_celsius=77;card.hass={...hass};check(root.querySelector('[data-high="1"]').value==='77','Successful apply releases draft for later external changes');
input=root.querySelector('[data-high="1"]');input.value='99';input.dispatchEvent(new Event('input',{bubbles:true}));card.setConfig({device_id:'second'});card.hass={...hass};await wait();check(root.querySelector('[data-high="1"]').value==='80','Changing device discards previous device drafts');
// A late response for a previous selection must not overwrite the new device.
let resolveOld;hass.callWS=m=>m.type==='config/entity_registry/list'?new Promise(resolve=>{resolveOld=resolve;}):Promise.resolve(m.type==='config/device_registry/list'?['first','second'].map(id=>({id,name:id,model:'TP25'})):{});
card.hass={...hass};card.setConfig({device_id:'first'});await wait();const oldResolver=resolveOld;
card.hass={...hass,callWS:async m=>m.type==='config/entity_registry/list'?rows:m.type==='config/device_registry/list'?['first','second'].map(id=>({id,name:id,model:'TP25'})):{}};card.setConfig({device_id:'second'});await wait();oldResolver(rows);await wait();
check(card._selectedDeviceId==='second'&&root.querySelector('[data-high="1"]').value==='80','Late registry response cannot restore previous selection');
// History requests are scoped to the selected device and configuration.
let oldHistory;const devices=['first','second'].map(id=>({id,name:id,model:'TP25',name_by_user:id==='second'?'Renamed thermometer':null}));
const historyWS=m=>m.type==='config/entity_registry/list'?Promise.resolve(rows):m.type==='config/device_registry/list'?Promise.resolve(devices):m.entity_ids[0].includes('first')?new Promise(resolve=>{oldHistory=resolve;}):Promise.resolve({'sensor.second_probe_1_temperature':[{state:'26',last_updated:'2026-10-18T00:00:00Z',attributes:{unit_of_measurement:'°C'}}]});
card.hass={...hass,callWS:historyWS};card.setConfig({device_id:'first'});await wait();const pendingHistory=oldHistory;
card.setConfig({device_name:'Renamed thermometer'});await wait();
check(card._selectedDeviceId==='second'&&card._history['sensor.second_probe_1_temperature']?.[0]?.v===26,'New device history loads while previous request is pending');
pendingHistory({'sensor.first_probe_1_temperature':[{state:'99',last_updated:'2026-10-18T00:00:00Z'}]});await wait();
check(!card._history['sensor.first_probe_1_temperature']&&card._history['sensor.second_probe_1_temperature']?.[0]?.v===26,'Late history cannot overwrite selected device history');
check(root.textContent.includes('Renamed thermometer'),'HA device rename is used for selection and title');
document.querySelector('#result').textContent='PASS: '+checks.join('\nPASS: ');
}catch(e){document.querySelector('#result').textContent='FAIL: '+e.stack}})();
</script></html>
