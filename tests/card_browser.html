<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;font-family:Arial,sans-serif;background:#eef0f2;color:#212121;padding:20px;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}.panel{width:410px;padding:18px;background:#fafafa;--primary-text-color:#212121;--secondary-text-color:#6b6b6b;--primary-color:#039be5;--divider-color:#ddd;--card-background-color:#fff;--ha-card-background:#fff;--secondary-background-color:#f2f2f2;--ha-card-border-radius:12px}.dark{background:#111;--primary-text-color:#eee;--secondary-text-color:#aaa;--primary-color:#03a9f4;--divider-color:#383838;--card-background-color:#1c1c1c;--ha-card-background:#1c1c1c;--secondary-background-color:#282828}h1{font-size:14px;font-weight:400;margin:0 0 16px}.dark h1{color:white}#result{font-size:11px;white-space:pre-wrap;max-width:420px}ha-card{display:block;border:1px solid var(--divider-color)}
</style><section class="panel"><h1>Home Assistant · Helles Theme</h1><thermopro-thermometer-card id="light"></thermopro-thermometer-card><pre id="result">RUNNING</pre></section><section class="panel dark"><h1>Home Assistant · Dunkles Theme</h1><thermopro-thermometer-card id="dark"></thermopro-thermometer-card></section>
<script src="../thermopro-thermometer-card.js"></script><script>
customElements.define("ha-card",class extends HTMLElement{connectedCallback(){this.style.display="block";this.style.border="1px solid var(--divider-color)"}});
(async()=>{const checks=[];const assert=(condition,message)=>{if(!condition)throw Error(message);checks.push(message)};try{
const rows=[],states={};const add=(id,name,state,attributes={})=>{rows.push({entity_id:id,original_name:name,device_id:'tp25',platform:'thermopro'});states[id]={state,attributes}};
for(let n=1;n<=4;n++){add(`sensor.tp25_probe_${n}_temperature`,`Probe ${n} temperature`,n===1?'18.6':'unknown',{device_class:'temperature',unit_of_measurement:'°C'});add(`binary_sensor.tp25_probe_${n}_connected`,`Probe ${n} connected`,n===1?'on':'off',{raw_state:n===1?'valid':'missing'});add(`sensor.tp25_probe_${n}_profile`,`Probe ${n} alarm profile`,'off',{saved_presets:[{name:'Lachs',mode:'target',high:55}]})}
add('binary_sensor.tp25_connection','Connection','on');add('sensor.tp25_battery','Battery','96',{unit_of_measurement:'%'});add('sensor.tp25_rssi','RSSI','-63',{unit_of_measurement:'dBm'});add('switch.tp25_beeper','Device alarm sound','on');add('switch.tp25_connection_enabled','Bluetooth connection','on');add('select.tp25_unit','Device display unit','Celsius');
const calls=[];const hass={language:"de",states,callService:async(...args)=>calls.push(args),callWS:async m=>m.type==='config/entity_registry/list'?rows:m.type==='config/device_registry/list'?[{id:'tp25',name:'ThermoPro TP25',model:'TP25'}]:[]};
const cards=[document.querySelector('#light'),document.querySelector('#dark')];for(const card of cards){card.setConfig({device_id:'tp25'});card.hass=hass}await new Promise(r=>setTimeout(r,50));const card=cards[0],shadow=card.shadowRoot;
assert(shadow.querySelectorAll('article.probe').length===1,'Only attached probe shown');assert(!shadow.querySelector('[data-save-profile="2"]'),'No controls for disconnected probe');
assert(!shadow.querySelector('[data-section=alarms]').open,'Alarm section starts collapsed');shadow.querySelector('[data-section=alarms]').open=true;shadow.querySelector('[data-high="1"]').value='67.5';shadow.querySelector('[data-high="1"]').dispatchEvent(new Event("input",{bubbles:true}));states['sensor.tp25_probe_1_temperature'].state='18.7';card.hass={...hass};assert(shadow.querySelector('[data-section=alarms]').open,'Accordion survives HA update');assert(shadow.querySelector('[data-high="1"]').value==='67.5','Draft survives HA update');
shadow.querySelector('[data-mode="1"]').value='target';shadow.querySelector('[data-save-profile="1"]').click();await Promise.resolve();assert(calls.length===1&&calls[0][2].high===67.5,'One click sends one alarm command');
shadow.querySelector('[data-toggle="switch.tp25_beeper"]').click();await Promise.resolve();assert(calls.length===2,'One click sends one switch command');
shadow.querySelector('[data-section=presets]').open=true;shadow.querySelector('[data-edit-preset="Lachs"]').click();assert(shadow.querySelector('[data-preset-name]').value==='Lachs','Preset editor loads saved values');shadow.querySelector('[data-section=presets]').open=false;
assert(getComputedStyle(shadow.querySelector('ha-card')).backgroundColor==='rgb(255, 255, 255)','Light theme background');assert(getComputedStyle(cards[1].shadowRoot.querySelector('ha-card')).backgroundColor==='rgb(28, 28, 28)','Dark theme background');
assert(card.scrollWidth<=410,'Card fits narrow panel');document.querySelector('#result').textContent='PASS: '+checks.join('\nPASS: ');
}catch(e){document.querySelector('#result').textContent='FAIL: '+e.stack}})();
</script></html>
